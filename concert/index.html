<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>演奏会進行メーカー</title>
<meta name="description" content="1行打つだけで演目を追加。タイムテーブル・進行台本・プログラムを自動で作る、学校の演奏会のための進行表アプリ。">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f4; --surface:#ffffff; --ink:#1f1d1a; --muted:#7d776d; --faint:#b3ada3;
  --line:#ebe6dd; --hover:#f4f1ea;
  --accent:#7d2b3a; --accent-ink:#ffffff; --accent-soft:#f5e9eb;
  --danger:#c0392b; --danger-soft:#fbeaea;
  --c-perform:#3d5a98; --c-break:#3f7d5c; --c-change:#a8701c; --c-speech:#7a5a8c; --c-plain:#7d776d;
  --shadow:0 10px 30px rgba(40,30,20,.12);
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141312; --surface:#1c1b19; --ink:#ece8e1; --muted:#9c958a; --faint:#5f5a53;
    --line:#2c2a27; --hover:#232220;
    --accent:#e09aa6; --accent-ink:#1c1b19; --accent-soft:#33252a;
    --danger:#ef7a6e; --danger-soft:#3a2321;
    --c-perform:#8fa8e0; --c-break:#7fc29f; --c-change:#e0ad5c; --c-speech:#bf9fd1; --c-plain:#9c958a;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(190px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}

/* ---------- 上部 ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 4px}
.brand{font-family:var(--mincho);font-size:13px;letter-spacing:.18em;color:var(--muted)}

.info{margin:18px 0 6px}
.info-line{display:block;width:100%;text-align:left;border-radius:14px;padding:10px 12px;margin:0 -12px;width:calc(100% + 24px)}
.info-line:hover{background:var(--hover)}
.info-name{font-family:var(--mincho);font-weight:600;font-size:24px;line-height:1.35;margin:0;letter-spacing:.02em}
.info-name.empty{color:var(--faint)}
.info-meta{color:var(--muted);font-size:13px;margin-top:4px}
.info-meta .sep{margin:0 .5em;color:var(--faint)}
.info-form{display:none;margin-top:8px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.info.open .info-line{display:none}
.info.open .info-form{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 14px}
.grid .full{grid-column:1/-1}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;outline:none}
.field textarea{resize:vertical;min-height:62px}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.form-foot{display:flex;justify-content:space-between;margin-top:16px}
.btn{border-radius:999px;padding:8px 18px;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.text{border:0;background:none;padding:8px 6px;color:var(--muted)}
.btn.text.danger{color:var(--danger)}

/* ---------- 終演予定バー ---------- */
.status{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 -20px;padding:10px 20px}
.status-in{display:flex;align-items:baseline;gap:4px 14px;flex-wrap:wrap;font-size:14px;width:100%;text-align:left}
.status-in::after{content:"内訳";margin-left:auto;font-size:11px;color:var(--faint);align-self:center}
.status.detail .status-in::after{content:"閉じる"}
.status-detail{display:none;padding:12px 0 4px;font-size:13px;color:var(--muted)}
.status.detail .status-detail{display:block}
.sum{display:flex;flex-wrap:wrap;gap:4px 18px}
.sample[hidden]{display:none}
.status .sum b{font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);margin-left:4px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,190px));gap:2px 28px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.groups span{display:flex;justify-content:space-between;gap:8px}
.groups span i{font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums}
.sample{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:12px;padding:8px 8px 8px 16px;margin:4px 0 12px}
.sample .btn{margin-left:auto;padding:5px 14px;font-size:13px;border-color:var(--accent);color:var(--accent);background:var(--surface)}
.sample .x{width:30px;height:30px;border-radius:50%;color:var(--muted);font-size:17px}
.empty{color:var(--muted);font-size:13.5px;line-height:1.9;text-align:center;margin:28px 0}
.empty b{color:var(--ink);font-weight:500;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.status b{font-family:var(--mincho);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin-left:4px}
.status .slash{color:var(--faint)}
.status .left{color:var(--muted)}
.status .left b{color:var(--ink)}
.status.over .left,.status.over .left b{color:var(--danger)}

/* ---------- 一覧 ---------- */
.list{list-style:none;margin:8px 0 0;padding:0}
.row{position:relative;border-bottom:1px solid var(--line);touch-action:pan-y;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row-bg{position:absolute;inset:0;background:var(--danger);color:#fff;display:flex;align-items:center;
  justify-content:flex-end;padding:0 22px;font-size:13px;opacity:0;pointer-events:none}
.row.swiping .row-bg{opacity:1}
.row-main{position:relative;display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;
  padding:14px 4px;background:var(--bg);cursor:pointer;transition:background .15s}
.row-main:hover{background:var(--hover)}
.r-time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;letter-spacing:.02em}
.r-body{min-width:0}
.r-title{font-family:var(--mincho);font-weight:600;font-size:16.5px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-sub{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.r-sub .tag{display:inline-block;font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
.r-min{font-variant-numeric:tabular-nums;font-size:16px;text-align:right;min-width:42px}
.r-min small{font-size:11px;color:var(--muted);margin-left:1px}
.r-min.guess{color:var(--muted)}
.r-min em{font-style:normal;font-size:10px;color:var(--c-change);border:1px solid currentColor;border-radius:4px;padding:0 3px;margin-right:5px;vertical-align:2px}
.status .warn,.status .warn b{color:var(--c-change)}
.r-del{position:absolute;right:-34px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;
  color:var(--faint);font-size:18px;line-height:28px;opacity:0;transition:opacity .15s}
.r-del:hover{color:var(--danger);background:var(--danger-soft)}
@media (hover:hover){.row-main:hover .r-del{opacity:1}}
@media (max-width:760px){.r-del{display:none}}

.chip{display:inline-block;font-size:10.5px;line-height:1;padding:4px 7px 3px;border-radius:999px;margin-right:7px;vertical-align:2px;
  font-family:var(--gothic);font-weight:500;letter-spacing:.04em;
  color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.t-perform{--c:var(--c-perform)} .t-break{--c:var(--c-break)} .t-change{--c:var(--c-change)}
.t-speech{--c:var(--c-speech)} .t-announce,.t-open,.t-close,.t-other{--c:var(--c-plain)}
.row.t-break .row-main{background:color-mix(in srgb,var(--c-break) 5%,var(--bg))}
.row.t-break .row-main:hover{background:color-mix(in srgb,var(--c-break) 9%,var(--bg))}

.row.joined{border-bottom-color:transparent}
.row.cont .row-main{padding-top:6px}
.row.joined:not(.open) .row-main{padding-bottom:8px}
.row.dragging{z-index:30}
.row.dragging .row-main{box-shadow:var(--shadow);border-radius:12px;background:var(--surface)}
body.is-dragging .row:not(.dragging){transition:transform .18s ease}
body.is-dragging{cursor:grabbing}
.row.flash .row-main{animation:flash 1.2s ease}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:var(--bg)}}

/* ---------- その場で編集 ---------- */
.editor{display:none;position:relative;padding:4px 4px 20px 70px;background:var(--bg)}
.row.open .editor{display:block}
.row.open .row-main{background:var(--hover)}
.types{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 16px}
body.typing-elsewhere .composer{transform:translateY(120%)!important;transition:transform .2s}
.row-main:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
.types button{font-size:12px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.types button.on{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ed-grid .full{grid-column:1/-1}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.stepper button{width:38px;height:36px;font-size:18px;color:var(--muted)}
.stepper button:hover{color:var(--ink)}
.stepper input{width:44px;text-align:center;border:0;background:none;outline:none;font-variant-numeric:tabular-nums;padding:0}
.stepper span{font-size:12px;color:var(--muted);margin-right:4px}
.ed-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}

/* ---------- 下の入力欄 ---------- */
.composer{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--bg);padding:10px 0 calc(14px + env(safe-area-inset-bottom))}
.composer::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:28px;pointer-events:none;
  background:linear-gradient(to top,var(--bg),color-mix(in srgb,var(--bg) 0%,transparent))}
.composer .wrap{position:relative}
.preview{min-height:22px;font-size:12.5px;color:var(--muted);padding:0 6px 6px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.preview .k{color:var(--faint);margin-left:8px;font-size:11px}
.preview .k:first-of-type{margin-left:0}
.preview .v{color:var(--ink)}
.preview .enter{margin-left:auto;color:var(--faint);font-size:11px}
.suggest{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:0 4px 8px;margin:0 -4px}
.suggest::-webkit-scrollbar{display:none}
.suggest:empty{display:none}
.suggest button{flex:none;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.suggest button:hover{border-color:var(--accent);color:var(--accent)}
.bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:6px 6px 6px 20px;box-shadow:var(--shadow)}
.bar:focus-within{border-color:var(--accent)}
.bar input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:16px;padding:8px 0}
.bar input::placeholder{color:var(--faint)}
.add{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:22px;line-height:40px;flex:none;opacity:.35;transition:opacity .15s}
.add.ready{opacity:1}

/* ---------- 転換の入れ忘れ・ステージ配置 ---------- */
.gap-add{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);z-index:2;font-size:11.5px;line-height:1.5;
  padding:1px 12px;border-radius:999px;border:1px dashed var(--c-change);color:var(--c-change);background:var(--bg);white-space:nowrap}
.gap-add:hover{background:color-mix(in srgb,var(--c-change) 12%,var(--bg))}
body.is-dragging .gap-add{display:none}
.r-sub .task,.r-plain .task{color:var(--c-change)}
.r-plain{font-size:14px;line-height:1.6;color:var(--ink)}
.r-plain .faint{color:var(--faint);font-size:12.5px}
.row:not(.t-perform) .row-main{padding-top:10px;padding-bottom:10px}
.row:not(.t-perform) .r-time,.row:not(.t-perform) .r-min{color:var(--muted);font-size:13.5px}
.row.t-change .r-sub,.row.t-break .r-sub{white-space:normal}
.setup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tog{font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.tog.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.cnt{display:inline-flex;align-items:center;font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 12px;background:var(--surface)}
.cnt input{width:34px;border:0;background:none;outline:none;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink);padding:3px 0}
.field label small{color:var(--faint);margin-left:4px}
.auto{font-size:13.5px;line-height:1.9;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--c-change) 9%,var(--bg))}
.auto b{font-weight:600;color:var(--c-change);font-size:12px;display:block}
.ed-foot .right{display:flex;gap:8px}
.preview .anchor{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-size:11.5px;margin-left:auto}
.preview .anchor button{color:var(--accent);font-size:15px;line-height:1;padding:0 4px}
.preview .anchor + .enter{margin-left:10px}
.status .margin{font-size:12.5px;color:var(--muted)}
.status .margin b{font-size:15px}
.status .margin.short,.status .margin.short b{color:var(--danger)}

/* ---------- お知らせ（元に戻す） ---------- */
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-20px);z-index:50;
  background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 10px 9px 20px;font-size:13.5px;display:flex;gap:14px;align-items:center;
  opacity:0;pointer-events:none;transition:all .2s;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast{width:max-content}
.toast span{min-width:0}
.toast button{color:var(--bg);font-weight:600;padding:4px 12px;border-radius:999px;background:color-mix(in srgb,var(--bg) 18%,transparent);flex:none}

@media (max-width:520px){
  .wrap{padding:0 16px}
  .status{margin:0 -16px;padding:10px 16px}
  .info-name{font-size:21px}
  .row-main{grid-template-columns:46px 1fr auto;gap:10px}
  .editor{padding-left:4px}
  .grid3{grid-template-columns:1fr 1fr}
  .types{flex-wrap:nowrap;overflow-x:auto;margin-right:-16px;padding-right:16px;scrollbar-width:none}
  .types button{flex:none}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="topbar">
    <div class="brand">演奏会進行メーカー</div>
  </header>

  <section class="info" id="info">
    <button class="info-line" id="infoLine" type="button"></button>
    <div class="info-form" id="infoForm">
      <div class="grid">
        <div class="field full"><label for="f-name">演奏会名</label><input id="f-name" data-info="name"></div>
        <div class="field"><label for="f-date">日付</label><input id="f-date" type="date" data-info="date"></div>
        <div class="field"><label for="f-venue">会場</label><input id="f-venue" data-info="venue"></div>
        <div class="field full grid3">
          <div class="field"><label for="f-doors">開場</label><input id="f-doors" type="time" data-info="doors"></div>
          <div class="field"><label for="f-start">開演</label><input id="f-start" type="time" data-info="start"></div>
          <div class="field"><label for="f-exit">会場退出</label><input id="f-exit" type="time" data-info="exit"></div>
        </div>
        <div class="field"><label for="f-mc">司会者</label><input id="f-mc" data-info="mc" placeholder="例）放送部 山田さん"></div>
        <div class="field"><label for="f-tear">片付けにかかる時間（分）</label><input id="f-tear" data-info="teardown" inputmode="numeric" placeholder="30"></div>
      </div>
      <div class="form-foot"><button class="btn text danger" id="resetBtn" type="button">白紙に戻す</button><button class="btn primary" id="infoDone" type="button">閉じる</button></div>
    </div>
  </section>

  <div class="sample" id="sampleBar" hidden>記入例が入っています<button class="btn" id="blankBtn" type="button">白紙から始める</button><button class="x" id="sampleX" type="button" aria-label="このまま使う">×</button></div>

  <div class="status" id="status"><button class="status-in" id="statusIn" type="button" aria-expanded="false"></button><div class="status-detail" id="statusDetail"></div></div>

  <ul class="list" id="list"></ul>
  <p class="empty" id="emptyHint" hidden>下の欄に <b>合唱部 翼をください 村井邦彦 4</b> のように打って Enter。<br>何行かまとめて貼り付けても入ります。</p>
</div>

<div class="composer">
  <div class="wrap">
    <div class="suggest" id="suggest"></div>
    <div class="preview" id="preview"></div>
    <div class="bar">
      <input id="line" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="enter"
        placeholder="合唱部 翼をください 村井邦彦 4" aria-label="演目を1行で入力">
      <button class="add" id="addBtn" type="button" aria-label="追加">＋</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn" type="button">元に戻す</button></div>

<script>
'use strict';
/* ============================================================
   データ
   ============================================================ */
const STORE_KEY = 'concert-maker-v1';
const TYPES = ['perform','break','change','speech','announce','open','close','other'];
const TYPE_LABEL = {perform:'演奏',break:'休憩',change:'転換',speech:'あいさつ',announce:'影アナ',open:'開会',close:'閉会',other:'その他'};
const DEFAULT_MIN = {perform:5,break:15,change:5,speech:3,announce:2,open:1,close:2,other:3};
const SETUP_TOGGLES = [['riser','ひな壇'],['piano','ピアノ'],['podium','指揮台']];
const SETUP_COUNTS = [['chairs','椅子'],['stands','譜面台'],['mics','マイク']];

const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const newItem = (type, o = {}) => ({id:uid(), type, group:'', title:'', composer:'', min:DEFAULT_MIN[type], mc:'', crew:'', ...o});

const SAMPLE_SETUPS = {
  '合唱部':    {riser:true, piano:true, mics:2},
  '弦楽合奏部': {podium:true, chairs:12, stands:12},
  '吹奏楽部':  {podium:true, chairs:40, stands:30},
  '全部員':    {riser:true, podium:true, chairs:40, stands:30},
};
function sampleConcert(){
  return {
    id:uid(), name:'第25回 音楽部 定期演奏会（記入例）', date:'2026-11-23', venue:'市民文化会館 大ホール',
    doors:'13:00', start:'13:30', exit:'16:30', mc:'', teardown:30, isSample:true,
    setups:JSON.parse(JSON.stringify(SAMPLE_SETUPS)),
    items:[
      newItem('announce',{min:2}),
      newItem('open',{min:1}),
      newItem('speech',{group:'校長',min:3}),
      newItem('perform',{group:'合唱部',title:'翼をください',composer:'村井邦彦',min:4,crew:'ピアノの蓋は半開'}),
      newItem('perform',{group:'合唱部',title:'ふるさと',composer:'岡野貞一',min:4}),
      newItem('change',{min:8}),

    ]
  };
}

state.groups ||= [];
state.setupMemory ||= {};

    items:[newItem('announce'), newItem('open'), newItem('close')]});

/* ============================================================
   時間の計算
   ============================================================ */
const toMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? (+m[1])*60 + (+m[2]) : null; };
const hm = m => { m = Math.round(m); m = ((m % 1440) + 1440) % 1440; return Math.floor(m/60) + ':' + String(m%60).padStart(2,'0'); };
const dur = m => { m = Math.round(Math.abs(m)); const h = Math.floor(m/60), r = m%60; return h ? (r ? `${h}時間${r}分` : `${h}時間`) : `${r}分`; };
// 4 / 4分 / 4:30 / 4'30" / 4分30秒 / 4分半 / 約4分 / (4分) を「分」に直す
const DUR_BODY = String.raw`約?(\d{1,3})(?:[:：'’′](\d{1,2})["”″]?|分(?:(\d{1,2})秒|(半))?)?`;
const DUR_RE = new RegExp(`^[（(]?${DUR_BODY}[）)]?$`);
const DUR_NC = DUR_BODY.replace(/\((?!\?)/g, '(?:');
// 「宝島6分」「（和泉宏隆）6」のように時間がくっついていたら離す
function splitGluedDur(s){
  return s
    .replace(new RegExp(`([）」』)”"])\\s*(${DUR_NC})$`), '$1 $2')
    .replace(/([^\s\d.])(約?\d{1,3}(?:分(?:\d{1,2}秒|半)?|['’′]\d{1,2}["”″]?|[:：]\d{2}))$/, '$1 $2');
}
function readDur(t){
  const m = DUR_RE.exec(t || '');
  if(!m) return null;
  return +m[1] + (m[4] ? 0.5 : Math.min(59, +(m[2] || m[3] || 0)) / 60);
}
const minTxt = m => { const s = Math.round((+m || 0) * 60), r = s % 60; return r ? `${Math.floor(s/60)}:${String(r).padStart(2,'0')}` : String(s/60); };

// 開演前アナウンス（影アナ）は開演時刻の前に流す。そのぶん開始を前にずらす
function schedule(c){
  const start = toMin(c.start) ?? 0;
  let lead = 0;
  for(const it of c.items){ if(it.type === 'announce') lead += +it.min || 0; else break; }
  let t = start - lead;
  const map = {};
  for(const it of c.items){ map[it.id] = {start:t, end:t + (+it.min || 0)}; t += +it.min || 0; }
  return {map, end:t};
}

/* ============================================================
   ステージ配置と転換作業
   ============================================================ */
const getSetup = (c, group) => c.setups[group] || state.setupMemory[group] || null;
function setSetup(c, group, s){ c.setups[group] = s; state.setupMemory[group] = s; }

function setupDiff(a, b){
  a ||= {}; b ||= {};
  const out = [];
  for(const [k, l] of SETUP_TOGGLES){
    if(a[k] && !b[k]) out.push(`${l}を片付け`);
    if(!a[k] && b[k]) out.push(`${l}を出す`);
  }
  for(const [k, l] of SETUP_COUNTS){
    const d = (+b[k] || 0) - (+a[k] || 0);
    if(d) out.push(`${l} ${d > 0 ? '+' : '−'}${Math.abs(d)}`);
  }
  return out;
}

// 演奏と演奏のあいだで、ステージをどう変えるか
//   tasks[転換や休憩のid] = 作業のリスト
//   missing[演奏のid] = true … 違う団体なのに転換が入っていない
function stagePlan(c){
  const tasks = {}, missing = {};
  let prev = null, slot = null, adjacent = false;
  for(const it of c.items){
    if(it.type === 'perform'){
      if(prev){
        const diff = setupDiff(getSetup(c, prev.group), getSetup(c, it.group));
        if(slot) tasks[slot] = diff;
        else if(adjacent && (diff.length || prev.group !== it.group)) missing[it.id] = true;
      }
      prev = it; slot = null; adjacent = true;
    }else{
      if(prev && !slot && (it.type === 'change' || it.type === 'break')) slot = it.id;
      adjacent = false;
    }
  }
  return {tasks, missing};
}

/* ============================================================
   1行入力の読み取り
   ============================================================ */
const z2h = s => s.replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)).replace(/　/g,' ');
const KEYWORDS = [
  ['break',   /^(休憩|休み|インターミッション)$/],
  ['change',  /^(転換|ステージ転換|セッティング|準備)$/],
  ['speech',  /^(あいさつ|挨拶|ご挨拶|ごあいさつ)$/],
  ['announce',/^(影アナ|影アナウンス|アナウンス|開演前アナウンス)$/],
  ['open',    /^(開会|開会式|開会のことば|開演)$/],
  ['close',   /^(閉会|閉会式|閉会のことば|終演)$/],
  ['other',   /^(その他|進行)$/],
];
const keywordType = w => (KEYWORDS.find(([,re]) => re.test(w)) || [])[0];
const SAME_GROUP_RE = /^(〃|同|同上|ゝ)$/;
const TITLE_TAIL_RE = /^(第.+|No\.?\s?\d+|Op\.?\s?\d+|.*楽章|.*番|.*組曲|より|から)$/i;

// prevGroup … 「〃」と書いたときに使う、直前の団体名
function parseLine(raw, prevGroup = ''){
  let s = z2h(raw).trim();
  if(!s) return null;
  // 「合唱部／翼をください／4」のような区切り
  if(/[\/／|｜]/.test(s) && !/[「『“"]/.test(s)) s = cellsToLine(s.split(/\s*[\/／|｜]\s*/));
  // 「翼をください(4分)」のようなカッコ付きの時間は離して読む
  s = s.replace(new RegExp(`\\s*[（(]\\s*(${DUR_NC})\\s*[）)]`), ' $1');
  s = splitGluedDur(s);
  // 「休憩15」のように数字がくっついていても読めるように
  s = s.replace(/^(\S+?)(\d{1,3})分?$/, (m, w, n) => keywordType(w) ? `${w} ${n}` : m);
  // 「」で囲んだ曲名はスペースを含んでもひとかたまり
  let quoted = null;
  // （" は 4'30" の秒にも使うので、前後そろっているときだけ曲名とみなす）
  s = s.replace(/[「『“]([^」』”]*)[」』”]?|"([^"]+)"/, (m, a, b) => { quoted = (a ?? b).trim(); return ' \u0001 '; });
  let toks = s.split(/\s+/).filter(Boolean);
  let min = null;
  if(toks.length > 1){
    const d = readDur(toks[toks.length-1]);
    if(d !== null){ min = d; toks.pop(); }
  }
  if(!toks.length) return null;

  const kw = keywordType(toks[0]);
  if(kw){
    const rest = toks.slice(1).map(t => t === '\u0001' ? quoted : t);
    // 休憩・転換は数字が途中にあっても拾う（例：転換 8 ひな壇撤去）
    if(min === null && (kw === 'break' || kw === 'change')){
      const i = rest.findIndex(t => readDur(t) !== null);
      if(i >= 0){ min = readDur(rest[i]); rest.splice(i,1); }
    }
    const text = rest.join(' ');
    const o = {type:kw, min: min ?? DEFAULT_MIN[kw]};
    if(kw === 'speech') o.group = text;
    else if(kw === 'break' || kw === 'change') o.crew = text;
    else if(kw === 'other') o.title = text;
    else if(text) o.mc = text;
    return o;
  }

  // それ以外は演奏：団体 曲名 作曲者 分
  if(SAME_GROUP_RE.test(toks[0])) toks[0] = prevGroup || '';
  let group = '', title = '', composer = '';
  const qi = toks.indexOf('\u0001');
  if(qi >= 0){
    group = toks.slice(0, qi).join(' ');
    title = quoted;
    composer = toks.slice(qi+1).join(' ');
  }else{
    group = toks[0];
    const r = toks.slice(1);
    if(r.length >= 2 && !TITLE_TAIL_RE.test(r[r.length-1])) composer = r.pop();
    title = r.join(' ');
  }
  // 「宝島（和泉宏隆）」のように、カッコの中が作曲者のとき
  const pm = /^(.+?)\s*[（(]([^（）()]+)[）)]$/.exec(title);
  if(pm && !composer && !TITLE_TAIL_RE.test(pm[2].trim())){
    title = pm[1];
    composer = pm[2].replace(/^(作曲|曲)\s*[:：]?\s*/, '').trim();
  }
  // 時間を書かなかった演奏は「仮」の時間（あとで部活に確認するため）
  return {type:'perform', group, title, composer, min: min ?? DEFAULT_MIN.perform, ...(min === null ? {guess:true} : {})};
}

// 貼り付けた1行を、1行入力と同じ形にそろえる（Excelの列にも対応）
const quoteIfSpace = t => /\s/.test(t) ? `「${t}」` : t;
// 表の1行（団体｜曲名｜作曲者｜分）を1行入力の形にする
function cellsToLine(cells){
  cells = cells.map(x => x.trim()).filter(Boolean);
  if(!cells.length) return '';
  if(keywordType(z2h(cells[0])) || cells.length < 2) return cells.join(' ');
  let min = '';
  if(readDur(z2h(cells[cells.length-1])) !== null) min = cells.pop();
  const [group, title = '', ...rest] = cells;
  return [group.replace(/\s+/g, ''), title ? `「${title}」` : '', rest.join(' '), min].filter(Boolean).join(' ');
}
function normalizePasted(line){
  line = line.replace(/^\s*(?:[0-9０-９]{1,2}\s*[.．)）、]|[①-⑳]|[・•\-－*]|\(\d+\))\s*/, '');
  return line.includes('\t') ? cellsToLine(line.split('\t')) : line.trim();
}
const isHeaderLine = l => /曲名|団体名|作曲者|演目/.test(l) && !/\d/.test(z2h(l));
// 「【吹奏楽部】」「吹奏楽部：」「■吹奏楽部」のような見出し行なら団体名を返す
function groupHeading(l){
  const m = /^\s*(?:[【\[［〔<＜]\s*(.+?)\s*[】\]］〕>＞]|[■◆●◎]\s*(.+?)|(.+?)\s*[：:])\s*$/.exec(z2h(l));
  const name = m && (m[1] || m[2] || m[3]).trim();
  return name && !keywordType(name) && readDur(name) === null ? name : null;
}
// 貼り付けた文章を1行入力の形に。見出しの下の行には、その団体名を付ける
function pastedToLines(text){
  const out = [];
  let group = null;
  const known = new Set(knownGroups());
  for(const raw of text.split(/\r?\n/)){
    if(!raw.trim() || isHeaderLine(raw)) continue;
    const h = groupHeading(raw);
    if(h){ group = h; known.add(h); continue; }
    let line = normalizePasted(raw);
    if(!line) continue;
    const first = z2h(line).split(/\s+/)[0];
    if(keywordType(first)) group = null;          // 休憩などが来たら見出しの区切りは終わり
    else if(known.has(first)) group = null;       // 団体名から書いてある行はそのまま
    if(group && !raw.includes('\t')){
      // 見出しの下では、時間をのぞいた残りを丸ごと曲名として読む
      const toks = splitGluedDur(z2h(line)).split(/\s+/);
      const d = toks.length > 1 && readDur(toks[toks.length-1]) !== null ? toks.pop() : '';
      const body = toks.join(' ');
      line = /[「『“"\/／|｜]/.test(body) ? `${group} ${line}` : [group, `「${body}」`, d].filter(Boolean).join(' ');
    }
    out.push(line);
  }
  return out;
}

/* ============================================================
   表示用のことば
   ============================================================ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function itemTitle(it){
  switch(it.type){
    case 'perform':  return it.title || it.group || '（曲名未入力）';
    case 'break':    return '休憩';
    case 'change':   return 'ステージ転換';
    case 'speech':   return it.group ? `${it.group}あいさつ` : 'あいさつ';
    case 'announce': return '開演前アナウンス';
    case 'open':     return '開会';
    case 'close':    return '閉会';
    default:         return it.title || 'その他';
  }
}

const WEEK = '日月火水木金土';
function fmtDate(d){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
  if(!m) return '';
  const dt = new Date(+m[1], +m[2]-1, +m[3]);
  return `${+m[2]}月${+m[3]}日（${WEEK[dt.getDay()]}）`;
}

function rowMainHTML(it, ctx){

// 同じ団体が続く演奏（2曲目以降）。団体名を省いて、ひとまとまりに見せる
function continuing(c){
  const set = new Set();
  c.items.forEach((it, i) => {
    const p = c.items[i-1];
    if(p && it.type === 'perform' && p.type === 'perform' && it.group && it.group === p.group) set.add(it.id);
  });
  return set;
}
const ctxOf = c => ({map:schedule(c).map, plan:stagePlan(c), cont:continuing(c)});
const rowClass = (it, ctx, next) =>
  `row t-${it.type}${it.id === openId ? ' open' : ''}${ctx.cont.has(it.id) ? ' cont' : ''}${next && ctx.cont.has(next.id) ? ' joined' : ''}`;

function renderList(){
  const c = cur(), ctx = ctxOf(c);
  listEl.innerHTML = c.items.map((it, i) => `
    <li class="${rowClass(it, ctx, c.items[i+1])}" data-id="${it.id}">

}

// 編集中の欄はそのままにして、時刻や転換作業などを全部の行で更新する
function refreshAll(){
  const c = cur(), ctx = ctxOf(c);
  listEl.querySelectorAll('.row').forEach(r => {
    const i = c.items.findIndex(x => x.id === r.dataset.id), it = c.items[i];

function refreshStatus(){
  const c = cur(), {end} = schedule(c), exit = toMin(c.exit), tear = +c.teardown || 0;
  let html = `<span>終演予定<b>${hm(end)}</b></span>`;
  let over = false;
  if(exit !== null){
    const left = exit - end;
    over = left < 0;
    html += `<span class="slash">／</span><span class="left">` +
      (over ? `退出時刻を<b>${dur(left)}</b>超過` : `退出まで あと<b>${dur(left)}</b>`) + `</span>`;
    if(tear && !over){
      const m = left - tear;
      html += `<span class="margin${m < 0 ? ' short' : ''}">片付け${tear}分を引くと ` + (m < 0 ? `<b>${dur(m)}</b>足りません` : `余裕<b>${dur(m)}</b>`) + `</span>`;
    }
  }
  $('statusIn').innerHTML = html;
  $('status').classList.toggle('over', over);
  if(statusOpen) $('statusDetail').innerHTML = breakdownHTML(c);
}

// 時間の内訳：オーバーしたとき、どこを削るか考える材料
let statusOpen = false;
function breakdownHTML(c){
  const sum = {perform:0, change:0, break:0, etc:0}, cnt = {perform:0, change:0}, byGroup = new Map();
  for(const it of c.items){
    const m = +it.min || 0;
    const k = it.type in sum ? it.type : 'etc';
    sum[k] += m;
    if(k in cnt) cnt[k]++;
    if(it.type === 'perform') byGroup.set(it.group || '（団体なし）', (byGroup.get(it.group || '（団体なし）') || 0) + m);
  }
  const guesses = c.items.filter(it => it.guess).length;
  const fm = m => minTxt(m).includes(':') ? minTxt(m).replace(':', '分') + '秒' : dur(m);
  return `<div class="sum">
      <span>演奏 ${cnt.perform}曲<b>${fm(sum.perform)}</b></span>
      <span>転換 ${cnt.change}回<b>${fm(sum.change)}</b></span>
      <span>休憩<b>${fm(sum.break)}</b></span>
      <span>あいさつ・進行<b>${fm(sum.etc)}</b></span>
      ${guesses ? `<span class="warn">時間が「仮」の曲<b>${guesses}件</b></span>` : ''}
    </div>` +
    (byGroup.size ? `<div class="groups">${[...byGroup].map(([gname, m]) => `<span>${esc(gname)}<i>${fm(m)}</i></span>`).join('')}</div>` : '');
}

let toastTimer = null, undoFn = null;

function deleteItem(id){
  const c = cur(), i = c.items.findIndex(x => x.id === id);
  if(i < 0) return;

  if(openId === id) openId = null;

  save(); renderList(); renderPreview();
  toast(`「${itemTitle(removed)}」を削除しました`, () => {
    c.items.splice(Math.min(i, c.items.length), 0, removed);

  });
}
function flash(id){
  const r = rowOf(id);

let suppressClick = false;
listEl.addEventListener('click', e => {
  if(suppressClick){ suppressClick = false; return; }
  const row = e.target.closest('.row'); if(!row) return;
  const id = row.dataset.id, it = itemOf(id), c = cur();
  const btn = e.target.closest('[data-act]'), act = btn?.dataset.act;
  if(act === 'del'){ deleteItem(id); return; }
  if(act === 'close'){ openId = null; renderList(); return; }
  if(act === 'after'){
    anchorId = id; openId = null;
    renderList(); renderPreview(); lineEl.focus();
    return;
  }
  if(act === 'addchange'){
    const ch = newItem('change');
    c.items.splice(c.items.indexOf(it), 0, ch);
    save(); renderList(); flash(ch.id);
    return;
  }
  if(act === 'type'){
    const t = btn.dataset.type;
    if(t !== it.type){
      if(+it.min === DEFAULT_MIN[it.type]) it.min = DEFAULT_MIN[t];
      it.type = t; save(); renderList();

    return;

  if(act === 'tog'){
    const s = {...(getSetup(c, it.group) || {})};

    setSetup(c, it.group, s);
    btn.classList.toggle('on', !!s[btn.dataset.k]);

  if(act === 'minus' || act === 'plus'){

    row.querySelector('[data-f="min"]').value = minTxt(it.min);

/* ---- 並べ替え（ドラッグ／スマホは長押し）と、スワイプで削除 ---- */
let g = null;   // 進行中のジェスチャー
const LONG_PRESS = 380;

function gStart(row, x, y, kind){
  g = {row, id:row.dataset.id, x0:x, y0:y, x, y, kind, mode:'pending', timer:null};
  if(kind === 'touch') g.timer = setTimeout(() => { if(g && g.mode === 'pending') dragBegin(); }, LONG_PRESS);
}
function gMove(x, y, e){
  if(!g) return;
  g.x = x; g.y = y;
  const dx = x - g.x0, dy = y - g.y0;
  if(g.mode === 'pending'){
    if(g.kind === 'mouse'){
      if(Math.abs(dy) > 6) dragBegin();
    }else{
      if(Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.5){ clearTimeout(g.timer); g.mode = 'swipe'; g.row.classList.add('swiping'); }
      else if(Math.hypot(dx, dy) > 10){ clearTimeout(g.timer); g = null; return; }   // 普通のスクロール
    }
  }
  if(g.mode === 'drag'){ if(e.cancelable) e.preventDefault(); dragMove(); }
  else if(g.mode === 'swipe'){
    if(e.cancelable) e.preventDefault();
    g.row.querySelector('.row-main').style.transform = `translateX(${Math.min(0, dx)}px)`;
  }
}
function gEnd(){
  if(!g) return;
  clearTimeout(g.timer);
  const mode = g.mode;
  if(mode === 'drag'){ suppressClick = true; dragEnd(); }
  else if(mode === 'swipe'){
    suppressClick = true;
    const main = g.row.querySelector('.row-main'), dx = g.x - g.x0, w = g.row.offsetWidth, id = g.id, row = g.row;
    main.style.transition = 'transform .2s ease';
    if(-dx > w * 0.33){
      main.style.transform = `translateX(${-w}px)`;
      setTimeout(() => deleteItem(id), 180);
    }else{
      main.style.transform = '';
      setTimeout(() => { main.style.transition = ''; row.classList.remove('swiping'); }, 220);
    }
  }
  setTimeout(() => { suppressClick = false; }, 400);
  g = null;
}

function dragBegin(){
  if(openId){ openId = null; renderList(); g.row = rowOf(g.id); }
  g.mode = 'drag';
  g.rows = [...listEl.children];
  g.idx = g.rows.indexOf(g.row);
  g.to = g.idx;
  g.rects = g.rows.map(r => { const b = r.getBoundingClientRect(); return {top:b.top + scrollY, h:b.height}; });
  g.startDocY = g.y0 + scrollY;
  g.row.classList.add('dragging');
  document.body.classList.add('is-dragging');
  if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
  const tick = () => {
    if(!g || g.mode !== 'drag') return;
    if(g.y < 90) scrollBy(0, -10);
    else if(g.y > innerHeight - 170) scrollBy(0, 10);
    dragMove();
    g.raf = requestAnimationFrame(tick);
  };
  g.raf = requestAnimationFrame(tick);
}
function dragMove(){
  const dy = g.y + scrollY - g.startDocY;
  g.row.style.transform = `translateY(${dy}px)`;
  const me = g.rects[g.idx], center = me.top + me.h/2 + dy;
  let to = g.idx;
  for(let i = g.idx + 1; i < g.rects.length; i++) if(center > g.rects[i].top + g.rects[i].h/2) to = i;
  for(let i = g.idx - 1; i >= 0; i--) if(center < g.rects[i].top + g.rects[i].h/2) to = i;
  g.to = to;
  g.rows.forEach((r, i) => {
    if(i === g.idx) return;
    let s = 0;
    if(g.idx < to && i > g.idx && i <= to) s = -me.h;
    if(to < g.idx && i >= to && i < g.idx) s = me.h;
    r.style.transform = s ? `translateY(${s}px)` : '';
  });
}
function dragEnd(){
  cancelAnimationFrame(g.raf);
  document.body.classList.remove('is-dragging');
  const c = cur();
  if(g.to !== g.idx){
    const [it] = c.items.splice(g.idx, 1);
    c.items.splice(g.to, 0, it);
    save();
  }
  const id = g.id, from = g.idx, to = g.to;
  renderList();
  if(to !== from){
    flash(id);
    toast(`「${itemTitle(itemOf(id))}」を移動しました`, () => {
      const items = cur().items, i = items.findIndex(x => x.id === id);
      if(i < 0) return;
      items.splice(from, 0, ...items.splice(i, 1));
      save(); renderList(); flash(id);
    });
  }
}

listEl.addEventListener('mousedown', e => {
  if(e.button !== 0) return;
  const main = e.target.closest('.row-main');
  if(!main || e.target.closest('button')) return;
  gStart(main.parentElement, e.clientX, e.clientY, 'mouse');
});
document.addEventListener('mousemove', e => { if(g && g.kind === 'mouse'){ gMove(e.clientX, e.clientY, e); } });
document.addEventListener('mouseup', () => { if(g && g.kind === 'mouse') gEnd(); });
listEl.addEventListener('touchstart', e => {
  if(e.touches.length !== 1){ if(g){ clearTimeout(g.timer); g = null; } return; }
  const main = e.target.closest('.row-main');
  if(!main || e.target.closest('button')) return;
  const t = e.touches[0];
  gStart(main.parentElement, t.clientX, t.clientY, 'touch');
}, {passive:true});
document.addEventListener('touchmove', e => { if(g && g.kind === 'touch'){ const t = e.touches[0]; gMove(t.clientX, t.clientY, e); } }, {passive:false});
document.addEventListener('touchend', () => { if(g && g.kind === 'touch') gEnd(); });
document.addEventListener('touchcancel', () => {
  if(!g) return;
  clearTimeout(g.timer);
  if(g.mode === 'drag'){ g.to = g.idx; dragEnd(); }
  else if(g.mode === 'swipe'){ g.row.classList.remove('swiping'); g.row.querySelector('.row-main').style.transform = ''; }
  g = null;
});

/* ============================================================
   画面：下の1行入力
   ============================================================ */
const lineEl = $('line'), previewEl = $('preview'), suggestEl = $('suggest'), addBtn = $('addBtn');

function rememberGroup(name){
  name = (name || '').trim();
  if(!name) return;
  state.groups = [name, ...state.groups.filter(x => x !== name)].slice(0, 40);
}
function knownGroups(){
  const set = new Set();
  const items = cur().items;
  for(let i = items.length - 1; i >= 0; i--) if(items[i].type === 'perform' && items[i].group) set.add(items[i].group);
  state.groups.forEach(x => set.add(x));
  state.concerts.forEach(c => c.items.forEach(it => { if(it.type === 'perform' && it.group) set.add(it.group); }));
  return [...set];
}
// これまでに入力した曲（今の演奏会にまだ入っていないもの）
function knownSongs(){
  const here = new Set(cur().items.filter(it => it.type === 'perform').map(it => it.group + '\u0000' + it.title));
  const seen = new Set(), out = [];
  for(const c of [cur(), ...state.concerts.filter(x => x !== cur())]){
    for(const it of c.items){
      if(it.type !== 'perform' || !it.title) continue;
      const key = it.group + '\u0000' + it.title;
      if(seen.has(key) || here.has(key)) continue;
      seen.add(key); out.push(it);
    }
  }
  return out;
}

// 追加する場所（この番号の位置に入れる）
function insertIndex(){
  const items = cur().items;
  if(anchorId){ const i = items.findIndex(x => x.id === anchorId); if(i >= 0) return i + 1; anchorId = null; }
  const ci = items.map(x => x.type).lastIndexOf('close');
  return ci >= 0 ? ci : items.length;
}
function groupBefore(idx){
  const items = cur().items;
  for(let i = idx - 1; i >= 0; i--) if(items[i].type === 'perform' && items[i].group) return items[i].group;
  return '';
}

function renderPreview(){
  const p = parseLine(lineEl.value, groupBefore(insertIndex()));
  addBtn.classList.toggle('ready', !!p);
  let html = '';
  if(p){
    const parts = [];
    const kv = (k, v) => v && parts.push(`<span class="k">${k}</span><span class="v">${esc(v)}</span>`);
    if(p.type === 'perform'){ kv('団体', p.group); kv('曲名', p.title); kv('作曲', p.composer); }
    else if(p.type === 'speech') kv('話す人', p.group);
    else if(p.type === 'other') kv('内容', p.title);
    else kv('メモ', p.crew || p.mc);
    kv('時間', minTxt(p.min) + (minTxt(p.min).includes(':') ? '' : '分'));
    html = `<span class="chip t-${p.type}">${TYPE_LABEL[p.type]}</span>${parts.join('')}`;
  }
  const a = anchorId && itemOf(anchorId);
  if(a) html += `<span class="anchor">「${esc(itemTitle(a))}」の後に追加<button type="button" data-act="unanchor" aria-label="閉会の前に追加に戻す">×</button></span>`;
  if(p) html += `<span class="enter">Enterで追加</span>`;
  previewEl.innerHTML = html;
  renderSuggest();
}
previewEl.addEventListener('mousedown', e => e.preventDefault());
previewEl.addEventListener('click', e => {
  if(e.target.closest('[data-act="unanchor"]')){ anchorId = null; renderPreview(); lineEl.focus(); }
});

function renderSuggest(){
  const v = z2h(lineEl.value);
  const focused = document.activeElement === lineEl;
  let chips = [];
  if(focused){
    const toks = v.split(/\s+/).filter(Boolean), trailing = /\s$/.test(v);
    if(!toks.length || (toks.length === 1 && !trailing)){
      // 1語目：団体名の候補（空のときは休憩・転換も）
      const q = (toks[0] || '').trim();
      chips = knownGroups().filter(gr => gr !== q && (!q || gr.includes(q))).slice(0, q ? 5 : 4)
        .map(gr => ({fill:gr + ' ', label:gr}));
      if(!q) chips.push({fill:'休憩 ', label:'休憩'}, {fill:'転換 ', label:'転換'});
    }else if(!keywordType(toks[0]) && (toks.length === 1 || (toks.length === 2 && !trailing)) && !v.includes('「')){
      // 2語目：その団体の、前に入力した曲の候補
      let group = toks[0];
      if(SAME_GROUP_RE.test(group)) group = groupBefore(insertIndex());
      const q = toks[1] || '';
      chips = knownSongs()
        .filter(s => q ? s.title.includes(q) : s.group === group)
        .sort((a, b) => (b.group === group) - (a.group === group))
        .slice(0, 5)
        .map(s => ({fill:[toks[0], quoteIfSpace(s.title), s.composer, minTxt(s.min)].filter(Boolean).join(' '),
                    label:`${s.title}・${minTxt(s.min)}${minTxt(s.min).includes(':') ? '' : '分'}`}));
    }
  }
  suggestEl.innerHTML = chips.map(ch => `<button type="button" data-fill="${esc(ch.fill)}">${esc(ch.label)}</button>`).join('');
}
suggestEl.addEventListener('mousedown', e => e.preventDefault());   // 入力欄のフォーカスを保つ
suggestEl.addEventListener('click', e => {
  const b = e.target.closest('[data-fill]'); if(!b) return;
  lineEl.value = b.dataset.fill;
  lineEl.focus();
  renderPreview();
});

// 何行でもまとめて追加。追加したものを返す
function addLines(lines){
  const c = cur(), added = [];
  let idx = insertIndex();
  for(const line of lines){
    const p = parseLine(line, groupBefore(idx));
    if(!p) continue;
    const it = newItem(p.type, p);
    c.items.splice(idx++, 0, it);
    if(it.type === 'perform') rememberGroup(it.group);
    added.push(it);
  }
  if(added.length && anchorId) anchorId = added[added.length-1].id;   // 続けて打つと、その後ろに並ぶ
  return added;
}

function addLine(){
  const text = lineEl.value;
  const [it] = addLines([text]);
  if(!it) return;
  state.lastLine = text;
  save();
  lineEl.value = '';
  renderList();
  renderPreview();
  flash(it.id);
}

lineEl.addEventListener('input', renderPreview);
lineEl.addEventListener('focus', renderSuggest);
lineEl.addEventListener('blur', () => setTimeout(renderSuggest, 120));
lineEl.addEventListener('keydown', e => {
  // 日本語変換を確定するためのEnterでは追加しない
  if(e.isComposing || e.keyCode === 229) return;
  if(e.key === 'Enter'){ e.preventDefault(); addLine(); }
  else if(e.key === 'ArrowUp' && !lineEl.value && state.lastLine){
    e.preventDefault();
    lineEl.value = state.lastLine;
    renderPreview();
  }
});
lineEl.addEventListener('paste', e => {
  const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
  if(!/[\r\n]/.test(text.trim())) return;   // 1行だけなら普通に貼り付け
  e.preventDefault();
  const lines = pastedToLines(text);
  const added = addLines(lines);
  if(!added.length) return;
  save(); renderList(); renderPreview();
  flash(added[0].id);
  const c = cur(), ids = new Set(added.map(x => x.id));
  toast(`${added.length}件 追加しました`, () => {
    c.items = c.items.filter(x => !ids.has(x.id));
    if(ids.has(anchorId)) anchorId = null;
    save(); renderList(); renderPreview();
  });
});
addBtn.addEventListener('click', () => { addLine(); lineEl.focus(); });

/* ---- スマホのキーボード対策 ---- */
const composerEl = document.querySelector('.composer');
if(window.visualViewport){
  const vv = window.visualViewport;
  const fit = () => {
    const off = innerHeight - vv.height - vv.offsetTop;
    composerEl.style.transform = off > 1 ? `translateY(${-off}px)` : '';
  };
  vv.addEventListener('resize', fit);
  vv.addEventListener('scroll', fit);
}
// 編集欄で文字を打っているあいだは、下の入力欄を隠して邪魔しない
document.addEventListener('focusin', e => {
  document.body.classList.toggle('typing-elsewhere', !!e.target.closest('.editor input, .editor textarea, .info-form input'));
});
document.addEventListener('focusout', () => setTimeout(() => {
  if(!document.activeElement?.closest?.('.editor input, .editor textarea, .info-form input')) document.body.classList.remove('typing-elsewhere');
}, 0));

/* ============================================================
   はじめの表示
   ============================================================ */
if(!state.currentId) state.currentId = state.concerts[0].id;
save();
renderInfo();
renderList();
renderPreview();
</script>
</body>
</html>
